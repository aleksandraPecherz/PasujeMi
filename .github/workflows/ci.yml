name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run check:ui
      - run: npx astro check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > supabase.env
      - name: Check that recipes are hidden from the anon key
        run: |
          source supabase.env
          # The service role bypasses RLS: the 5 seeded recipes must be there.
          seeded=$(curl -sf "$API_URL/rest/v1/recipes?select=id" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
          echo "service role: $seeded"
          echo "$seeded" | jq -e 'type == "array" and length == 5'
          # The anon key must get no rows: a permission error, not a list of recipes.
          status=$(curl -s -o anon.json -w '%{http_code}' "$API_URL/rest/v1/recipes?select=id" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
          echo "anon: $status $(cat anon.json)"
          [ "$status" = 401 ] || [ "$status" = 403 ]
          jq -e '.code == "42501"' anon.json
      - name: Check recipe insert permissions
        run: |
          source supabase.env
          suffix="$(date +%s)-$RANDOM"
          signup() {
            curl -sf "$API_URL/auth/v1/signup" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"rls-$1-$suffix@example.com\",\"password\":\"Passw0rd-$suffix\"}"
          }
          a=$(signup a)
          b=$(signup b)
          echo "$a" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          echo "$b" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          token_a=$(echo "$a" | jq -r '.access_token')
          id_a=$(echo "$a" | jq -r '.user.id')
          id_b=$(echo "$b" | jq -r '.user.id')
          # Every case sends an otherwise valid recipe and must be rejected with 42501.
          # $1 = label, $2 = bearer token, $3 = JSON fields merged into the recipe, $4 = expected HTTP status.
          expect_denied() {
            body=$(jq -n --argjson extra "$3" '{
              name: "RLS check",
              steps: ["Krok"],
              ingredients: [{name: "Mleko", product: "mleko", amount: null, unit: null, substitutes: []}]
            } + $extra')
            status=$(curl -s -o insert.json -w '%{http_code}' "$API_URL/rest/v1/recipes" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $2" -H "Content-Type: application/json" -d "$body")
            echo "$1: $status $(cat insert.json)"
            # $4 lists the accepted statuses: PostgREST answers anon with 401 or 403 depending on its version.
            [[ " $4 " == *" $status "* ]]
            jq -e 'type == "object" and .code == "42501"' insert.json > /dev/null
          }
          expect_denied "anon" "$ANON_KEY" '{}' "401 403"
          expect_denied "A as B" "$token_a" "{\"author_id\":\"$id_b\"}" 403
          expect_denied "A with null author" "$token_a" '{"author_id":null}' 403
          expect_denied "A with match_keys" "$token_a" "{\"author_id\":\"$id_a\",\"match_keys\":{}}" 403
          expect_denied "A with id" "$token_a" "{\"author_id\":\"$id_a\",\"id\":\"00000000-0000-0000-0000-000000000001\"}" 403
          # Nothing may have been inserted: the later steps count the seeded rows.
          count=$(curl -sf "$API_URL/rest/v1/recipes?select=id" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
          echo "$count" | jq -e 'type == "array" and length == 5'
      - name: Check recipe update and delete permissions
        run: |
          source supabase.env
          suffix="$(date +%s)-$RANDOM"
          signup() {
            curl -sf "$API_URL/auth/v1/signup" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"rls-$1-$suffix@example.com\",\"password\":\"Passw0rd-$suffix\"}"
          }
          a=$(signup a)
          b=$(signup b)
          echo "$a" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          echo "$b" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          token_a=$(echo "$a" | jq -r '.access_token')
          token_b=$(echo "$b" | jq -r '.access_token')
          id_b=$(echo "$b" | jq -r '.user.id')
          # A inserts the row the cases below work on; author_id defaults to A's id.
          curl -sf "$API_URL/rest/v1/recipes" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"name":"RLS update check","steps":["Krok"],"ingredients":[{"name":"Mleko","product":"mleko","amount":null,"unit":null,"substitutes":[]}]}' > inserted.json
          jq -e 'type == "array" and length == 1 and (.[0].id | type == "string")' inserted.json > /dev/null
          rid=$(jq -r '.[0].id' inserted.json)
          # Remove the test row with the service role on any exit, so a failed step leaves nothing behind.
          trap 'curl -s -X DELETE "$API_URL/rest/v1/recipes?id=eq.$rid" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" > /dev/null' EXIT
          row="$API_URL/rest/v1/recipes?id=eq.$rid"
          # $1 = label, $2 = method, $3 = URL, $4 = bearer token, $5 = JSON body ("" for none), $6 = accepted statuses.
          # Leaves the response body in res.json; the status is checked before the body.
          call() {
            if [ -n "$5" ]; then
              status=$(curl -s -o res.json -w '%{http_code}' -X "$2" "$3" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $4" \
                -H "Content-Type: application/json" -H "Prefer: return=representation" -d "$5")
            else
              status=$(curl -s -o res.json -w '%{http_code}' -X "$2" "$3" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $4" \
                -H "Prefer: return=representation")
            fi
            echo "$1: $status $(cat res.json)"
            [[ " $6 " == *" $status "* ]]
          }
          # Body type first, then the row count.
          expect_rows() {
            jq -e --argjson n "$1" 'type == "array" and length == $n' res.json > /dev/null
          }
          expect_denied() {
            jq -e 'type == "object" and .code == "42501"' res.json > /dev/null
          }
          service_row() {
            curl -sf "$row&select=name,match_keys,match_keys_version" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY"
          }
          # The service role stores keys, as `npm run match-keys` does.
          call "service role sets keys" PATCH "$row" "$SERVICE_ROLE_KEY" '{"match_keys":{"seed":true},"match_keys_version":2}' 200
          expect_rows 1
          # A changes only the name: the keys stay.
          call "A renames" PATCH "$row" "$token_a" '{"name":"RLS renamed"}' 200
          expect_rows 1
          after=$(service_row)
          echo "$after" | jq -e 'type == "array" and length == 1 and .[0].name == "RLS renamed" and .[0].match_keys != null and .[0].match_keys_version == 2' > /dev/null
          # A changes the ingredients: the trigger nulls the keys.
          call "A changes ingredients" PATCH "$row" "$token_a" '{"ingredients":[{"name":"Orzechy","product":"orzechy","amount":null,"unit":null,"substitutes":[]}]}' 200
          expect_rows 1
          after=$(service_row)
          echo "$after" | jq -e 'type == "array" and length == 1 and .[0].match_keys == null and .[0].match_keys_version == null' > /dev/null
          # B neither updates nor deletes A's row: RLS filters it out, no error.
          call "B renames" PATCH "$row" "$token_b" '{"name":"Hijacked"}' 200
          expect_rows 0
          call "B deletes" DELETE "$row" "$token_b" "" 200
          expect_rows 0
          after=$(service_row)
          echo "$after" | jq -e 'type == "array" and length == 1 and .[0].name == "RLS renamed"' > /dev/null
          # A on a missing id: empty, not an error.
          call "A on missing id" PATCH "$API_URL/rest/v1/recipes?id=eq.00000000-0000-0000-0000-000000000002" "$token_a" '{"name":"Nope"}' 200
          expect_rows 0
          # Columns without an update grant are rejected with 42501.
          call "A sets author_id to B" PATCH "$row" "$token_a" "{\"author_id\":\"$id_b\"}" 403
          expect_denied
          call "A nulls author_id" PATCH "$row" "$token_a" '{"author_id":null}' 403
          expect_denied
          call "A sets match_keys" PATCH "$row" "$token_a" '{"match_keys":{}}' 403
          expect_denied
          call "A sets id" PATCH "$row" "$token_a" '{"id":"00000000-0000-0000-0000-000000000001"}' 403
          expect_denied
          # PostgREST answers anon with 401 or 403 depending on its version.
          call "anon updates" PATCH "$row" "$ANON_KEY" '{"name":"Anon"}' "401 403"
          expect_denied
          call "anon deletes" DELETE "$row" "$ANON_KEY" "" "401 403"
          expect_denied
          # A deletes their own row.
          call "A deletes" DELETE "$row" "$token_a" "" 200
          expect_rows 1
          # Back to the 5 seeded rows: the later steps count them.
          count=$(curl -sf "$API_URL/rest/v1/recipes?select=id" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
          echo "$count" | jq -e 'type == "array" and length == 5'
      - name: Check admin permissions
        run: |
          source supabase.env
          suffix="$(date +%s)-$RANDOM"
          signup() {
            curl -sf "$API_URL/auth/v1/signup" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"rls-$1-$suffix@example.com\",\"password\":\"Passw0rd-$suffix\"}"
          }
          a=$(signup a)
          b=$(signup b)
          m=$(signup m)
          for u in "$a" "$b" "$m"; do
            echo "$u" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          done
          token_a=$(echo "$a" | jq -r '.access_token')
          token_b=$(echo "$b" | jq -r '.access_token')
          token_m=$(echo "$m" | jq -r '.access_token')
          id_a=$(echo "$a" | jq -r '.user.id')
          id_m=$(echo "$m" | jq -r '.user.id')
          service() {
            curl -sf "$@" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=representation"
          }
          # Remove everything the step creates on any exit, so a failed step leaves nothing behind.
          rid_a=""
          rid_n=""
          cleanup() {
            [ -z "$rid_a" ] || curl -s -X DELETE "$API_URL/rest/v1/recipes?id=eq.$rid_a" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" > /dev/null
            [ -z "$rid_n" ] || curl -s -X DELETE "$API_URL/rest/v1/recipes?id=eq.$rid_n" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" > /dev/null
            curl -s -X DELETE "$API_URL/rest/v1/admins?user_id=eq.$id_m" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" > /dev/null
          }
          trap cleanup EXIT
          # A inserts a recipe (author_id defaults to A); the service role inserts one without an author, like the seed.
          curl -sf "$API_URL/rest/v1/recipes" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"name":"Admin check A","steps":["Krok"],"ingredients":[{"name":"Mleko","product":"mleko","amount":null,"unit":null,"substitutes":[]}]}' > inserted.json
          jq -e 'type == "array" and length == 1 and (.[0].id | type == "string")' inserted.json > /dev/null
          rid_a=$(jq -r '.[0].id' inserted.json)
          service "$API_URL/rest/v1/recipes" \
            -d '{"name":"Admin check no author","steps":["Krok"],"ingredients":[{"name":"Mleko","product":"mleko","amount":null,"unit":null,"substitutes":[]}],"author_id":null}' > inserted.json
          jq -e 'type == "array" and length == 1 and (.[0].id | type == "string") and .[0].author_id == null' inserted.json > /dev/null
          rid_n=$(jq -r '.[0].id' inserted.json)
          # M becomes an admin; only the service role can write public.admins.
          service "$API_URL/rest/v1/admins" -d "{\"user_id\":\"$id_m\"}" > inserted.json
          jq -e 'type == "array" and length == 1' inserted.json > /dev/null
          row_a="$API_URL/rest/v1/recipes?id=eq.$rid_a"
          row_n="$API_URL/rest/v1/recipes?id=eq.$rid_n"
          row_m="$API_URL/rest/v1/admins?user_id=eq.$id_m"
          # $1 = label, $2 = method, $3 = URL, $4 = bearer token, $5 = JSON body ("" for none), $6 = accepted statuses.
          # Leaves the response body in res.json; the status is checked before the body.
          call() {
            if [ -n "$5" ]; then
              status=$(curl -s -o res.json -w '%{http_code}' -X "$2" "$3" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $4" \
                -H "Content-Type: application/json" -H "Prefer: return=representation" -d "$5")
            else
              status=$(curl -s -o res.json -w '%{http_code}' -X "$2" "$3" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $4" \
                -H "Prefer: return=representation")
            fi
            echo "$1: $status $(cat res.json)"
            [[ " $6 " == *" $status "* ]]
          }
          # Body type first, then the row count.
          expect_rows() {
            jq -e --argjson n "$1" 'type == "array" and length == $n' res.json > /dev/null
          }
          expect_denied() {
            jq -e 'type == "object" and .code == "42501"' res.json > /dev/null
          }
          # $1 = row URL; the service role reads it back.
          service_row() {
            curl -sf "$1&select=name,author_id,match_keys,match_keys_version" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY"
          }
          # M renames A's recipe; the author stays A.
          call "M renames a recipe of A" PATCH "$row_a" "$token_m" '{"name":"Admin renamed"}' 200
          expect_rows 1
          service_row "$row_a" | jq -e --arg a "$id_a" 'type == "array" and length == 1 and .[0].name == "Admin renamed" and .[0].author_id == $a' > /dev/null
          # The service role stores keys; M changes the ingredients: the trigger nulls them.
          call "service role sets keys" PATCH "$row_a" "$SERVICE_ROLE_KEY" '{"match_keys":{"seed":true},"match_keys_version":2}' 200
          expect_rows 1
          call "M changes ingredients" PATCH "$row_a" "$token_m" '{"ingredients":[{"name":"Orzechy","product":"orzechy","amount":null,"unit":null,"substitutes":[]}]}' 200
          expect_rows 1
          service_row "$row_a" | jq -e 'type == "array" and length == 1 and .[0].match_keys == null and .[0].match_keys_version == null' > /dev/null
          # Columns without an update grant stay closed to an admin.
          call "M sets author_id" PATCH "$row_a" "$token_m" "{\"author_id\":\"$id_m\"}" 403
          expect_denied
          call "M sets match_keys" PATCH "$row_a" "$token_m" '{"match_keys":{}}' 403
          expect_denied
          # M edits a recipe without an author; it stays without one.
          call "M renames a recipe without author" PATCH "$row_n" "$token_m" '{"name":"Admin renamed no author"}' 200
          expect_rows 1
          service_row "$row_n" | jq -e 'type == "array" and length == 1 and .[0].name == "Admin renamed no author" and .[0].author_id == null' > /dev/null
          # B is not an admin: RLS filters the recipe without an author out, no error.
          call "B renames a recipe without author" PATCH "$row_n" "$token_b" '{"name":"Hijacked"}' 200
          expect_rows 0
          call "B deletes a recipe without author" DELETE "$row_n" "$token_b" "" 200
          expect_rows 0
          service_row "$row_n" | jq -e 'type == "array" and length == 1 and .[0].name == "Admin renamed no author"' > /dev/null
          # public.admins: B cannot make themselves an admin or touch the row of M.
          call "B inserts into admins" POST "$API_URL/rest/v1/admins" "$token_b" "{\"user_id\":\"$id_m\"}" "401 403"
          expect_denied
          call "B updates the admin row of M" PATCH "$row_m" "$token_b" '{"created_at":"2000-01-01T00:00:00Z"}' 403
          expect_denied
          call "B deletes the admin row of M" DELETE "$row_m" "$token_b" "" 403
          expect_denied
          curl -sf "$row_m&select=user_id" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            | jq -e 'type == "array" and length == 1' > /dev/null
          # Each user reads only their own row of public.admins.
          call "B reads admins" GET "$API_URL/rest/v1/admins?select=user_id" "$token_b" "" 200
          expect_rows 0
          call "M reads admins" GET "$API_URL/rest/v1/admins?select=user_id" "$token_m" "" 200
          expect_rows 1
          jq -e --arg id "$id_m" '.[0].user_id == $id' res.json > /dev/null
          call "anon reads admins" GET "$API_URL/rest/v1/admins?select=user_id" "$ANON_KEY" "" "401 403"
          expect_denied
          # The role check lives in the private schema: it is not reachable through the API.
          call "M calls is_admin" POST "$API_URL/rest/v1/rpc/is_admin" "$token_m" '{}' 404
          jq -e 'type == "object" and .code == "PGRST202"' res.json > /dev/null
          # M deletes both recipes.
          call "M deletes a recipe of A" DELETE "$row_a" "$token_m" "" 200
          expect_rows 1
          call "M deletes a recipe without author" DELETE "$row_n" "$token_m" "" 200
          expect_rows 1
          # Back to the 5 seeded rows: the later steps count them.
          count=$(curl -sf "$API_URL/rest/v1/recipes?select=id" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
          echo "$count" | jq -e 'type == "array" and length == 5'
      - name: Check saved pantry permissions
        run: |
          source supabase.env
          suffix="$(date +%s)-$RANDOM"
          signup() {
            curl -sf "$API_URL/auth/v1/signup" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
              -d "{\"email\":\"pantry-$1-$suffix@example.com\",\"password\":\"Passw0rd-$suffix\"}"
          }
          a=$(signup a)
          b=$(signup b)
          echo "$a" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          echo "$b" | jq -e '(.access_token | type == "string") and (.user.id | type == "string")' > /dev/null
          token_a=$(echo "$a" | jq -r '.access_token')
          token_b=$(echo "$b" | jq -r '.access_token')
          id_a=$(echo "$a" | jq -r '.user.id')
          id_b=$(echo "$b" | jq -r '.user.id')
          # $1 = label, $2 = bearer token, $3 = method, $4 = URL query, $5 = JSON body ("" for none), $6 = extra Prefer value.
          # Leaves the HTTP status in $status and the response in pantry.json.
          request() {
            local args=(-s -o pantry.json -w '%{http_code}' -X "$3" "$API_URL/rest/v1/saved_pantry$4"
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $2" -H "Content-Type: application/json")
            [ -n "$6" ] && args+=(-H "Prefer: $6")
            [ -n "$5" ] && args+=(-d "$5")
            status=$(curl "${args[@]}")
            echo "$1: $status $(cat pantry.json)"
          }
          # Status first, then the type of the body, then its content.
          expect_ok() {
            [[ " $1 " == *" $status "* ]]
          }
          expect_denied() {
            [[ " $1 " == *" $status "* ]]
            jq -e 'type == "object" and .code == "42501"' pantry.json > /dev/null
          }
          upsert="return=minimal,resolution=merge-duplicates"
          row_a="{\"user_id\":\"$id_a\",\"staples\":[\"sol\"],\"exclusions\":[\"orzechy\"],\"updated_at\":\"2026-01-01T00:00:00Z\"}"
          row_a2="{\"user_id\":\"$id_a\",\"staples\":[\"sol\",\"pieprz\"],\"exclusions\":[],\"updated_at\":\"2026-01-02T00:00:00Z\"}"
          row_b="{\"user_id\":\"$id_b\",\"staples\":[\"cukier\"],\"exclusions\":[\"jogurt\"],\"updated_at\":\"2026-01-01T00:00:00Z\"}"
          request "A upserts own row" "$token_a" POST "?on_conflict=user_id" "$row_a" "$upsert"
          expect_ok "200 201 204"
          request "A upserts own row again (update)" "$token_a" POST "?on_conflict=user_id" "$row_a2" "$upsert"
          expect_ok "200 201 204"
          request "B inserts own row" "$token_b" POST "?on_conflict=user_id" "$row_b" "$upsert"
          expect_ok "200 201 204"
          # A sees exactly one row, its own, with the values of the second upsert.
          request "A reads" "$token_a" GET "?select=user_id,staples,exclusions" "" ""
          expect_ok 200
          jq -e 'type == "array"' pantry.json > /dev/null
          jq -e --arg id "$id_a" 'length == 1 and .[0].user_id == $id and .[0].staples == ["sol","pieprz"] and .[0].exclusions == []' pantry.json > /dev/null
          # A inserts a row for B (plain insert, no upsert): the policy's with check runs before the unique constraint.
          request "A inserts a row for B" "$token_a" POST "" "$row_b" ""
          expect_denied 403
          # A updates B's row: RLS hides it, so the request matches no rows and changes nothing.
          request "A patches B" "$token_a" PATCH "?user_id=eq.$id_b" '{"staples":["hacked"]}' "return=representation"
          expect_ok "200 204"
          if [ "$status" = 200 ]; then
            jq -e 'type == "array" and length == 0' pantry.json > /dev/null
          fi
          # The service role bypasses RLS: B's row must be untouched.
          row=$(curl -sf "$API_URL/rest/v1/saved_pantry?select=staples,exclusions&user_id=eq.$id_b" -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
          echo "B's row: $row"
          echo "$row" | jq -e 'type == "array" and length == 1 and .[0].staples == ["cukier"] and .[0].exclusions == ["jogurt"]' > /dev/null
          # There is no delete grant, not even for the owner's own row.
          request "A deletes own row" "$token_a" DELETE "?user_id=eq.$id_a" "" ""
          expect_denied 403
          # Anonymous callers get a permission error, not rows.
          request "anon reads" "$ANON_KEY" GET "?select=user_id" "" ""
          expect_denied "401 403"
      - name: Compute recipe match keys (idempotent)
        run: |
          source supabase.env
          export SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          first=$(npm run --silent match-keys)
          echo "first run: $first"
          [ "$first" = "updated 5" ]
          second=$(npm run --silent match-keys)
          echo "second run: $second"
          [ "$second" = "updated 0" ]
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup
